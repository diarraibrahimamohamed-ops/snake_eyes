name: AfricaWatch CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-api:
    name: Tests API Django
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: africanwatch_test
          POSTGRES_USER: aw_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        working-directory: apps/api
        run: |
          pip install -r requirements.txt
          python -m spacy download fr_core_news_sm || true
      - name: Run tests
        working-directory: apps/api
        env:
          DJANGO_SETTINGS_MODULE: africanwatch.settings.test
          POSTGRES_DB: africanwatch_test
          POSTGRES_USER: aw_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-ci-secret-key-not-for-production
        run: pytest --tb=short -q --cov=. --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: apps/api/coverage.xml
        continue-on-error: true

  lint-api:
    name: Lint API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install ruff
      - name: Ruff check
        working-directory: apps/api
        run: ruff check .

  test-web:
    name: Tests Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - working-directory: apps/web
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - working-directory: apps/web
        run: npm run lint
      - working-directory: apps/web
        run: npm run typecheck

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-api, test-web]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          target: production
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:latest
      - name: Build & push Web
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          target: production
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web:latest

  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/africanwatch
            git pull origin main
            docker compose pull
            docker compose up -d --no-deps api web celery_worker celery_beat
            docker compose exec api python manage.py migrate --noinput
            echo "Deployed at $(date)"
