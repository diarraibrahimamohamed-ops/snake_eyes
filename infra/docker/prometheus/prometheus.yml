global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'africanwatch'

scrape_configs:
  - job_name: 'africanwatch-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics/'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node_exporter:9100']
