version: '3.9'
name: africanwatch

services:
  postgres:
    image: postgres:16-alpine
    container_name: aw_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-africanwatch}
      POSTGRES_USER: ${POSTGRES_USER:-aw_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aw_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aw_net

  redis:
    image: redis:7-alpine
    container_name: aw_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_changeme} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aw_net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: aw_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles: ["lab"]
    networks:
      - aw_net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: aw_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    profiles: ["lab"]
    networks:
      - aw_net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: aw_kafka
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:9092:9092"
    depends_on:
      - zookeeper
    profiles: ["lab"]
    networks:
      - aw_net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: aw_api
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: africanwatch.settings.dev
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./security-lab/quarantine:/security-lab/quarantine:rw
      - ./security-lab/jobs:/security-lab/jobs:rw
      - ./security-lab/results:/security-lab/results:rw
    networks:
      - aw_net

  celery_worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: aw_celery_worker
    restart: unless-stopped
    command: celery -A africanwatch worker -l info -Q default,threat_intel,osint,scans,security_lab,ai -c ${CELERY_CONCURRENCY:-2}
    env_file: .env
    mem_limit: 1536m
    cpus: "1.25"
    pids_limit: 192
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    environment:
      DJANGO_SETTINGS_MODULE: africanwatch.settings.dev
    volumes:
      - "./apps/api:/app"
      - "./security-lab/code:/security-lab/code:ro"
      - "./security-lab/containers:/security-lab/containers:ro"
      - "./security-lab/credentials:/security-lab/credentials:ro"
      - "./security-lab/wordlists:/security-lab/wordlists:ro"
      - "./security-lab/quarantine:/security-lab/quarantine:rw"
      - "./security-lab/jobs:/security-lab/jobs:rw"
      - "./security-lab/results:/security-lab/results:rw"
      - "./security-lab/yara:/security-lab/yara:ro"
    depends_on:
      - api
      - redis
    networks:
      - aw_net

  clamav_updater:
    build:
      context: .
      dockerfile: infra/security-scanner/Dockerfile
    container_name: aw_clamav_updater
    restart: unless-stopped
    profiles: ["security"]
    command: ["freshclam", "--foreground=true", "--checks=12"]
    user: "0:0"
    mem_limit: 256m
    cpus: "0.25"
    volumes:
      - clamav_db:/var/lib/clamav
    networks:
      - aw_net

  malware_scanner:
    build:
      context: .
      dockerfile: infra/security-scanner/Dockerfile
    container_name: aw_malware_scanner
    restart: unless-stopped
    profiles: ["security"]
    network_mode: "none"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 768m
    cpus: "0.75"
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    volumes:
      - ./security-lab/quarantine:/security-lab/quarantine:ro
      - ./security-lab/jobs:/security-lab/jobs:rw
      - ./security-lab/results:/security-lab/results:rw
      - ./security-lab/yara:/security-lab/yara:ro
      - clamav_db:/var/lib/clamav:ro

  tor:
    image: svengo/tor:0.4.9.12
    container_name: aw_tor
    restart: unless-stopped
    profiles: ["intel"]
    environment:
      SOCKS_PORT: "9050"
      SOCKS_POLICY: "accept 172.28.0.0/16"
    ports:
      - "127.0.0.1:19050:9050"
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - aw_net

  celery_beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: aw_celery_beat
    restart: unless-stopped
    command: celery -A africanwatch beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: africanwatch.settings.dev
    volumes:
      - "./apps/api:/app"
    depends_on:
      - api
      - redis
    networks:
      - aw_net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    container_name: aw_web
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    networks:
      - aw_net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: aw_kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      - elasticsearch
    profiles: ["lab"]
    networks:
      - aw_net

  prometheus:
    image: prom/prometheus:latest
    container_name: aw_prometheus
    restart: unless-stopped
    volumes:
      - ./infra/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    profiles: ["lab"]
    networks:
      - aw_net

  grafana:
    image: grafana/grafana:latest
    container_name: aw_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-grafana_changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/docker/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "127.0.0.1:3001:3000"
    profiles: ["lab"]
    networks:
      - aw_net

  nginx:
    image: nginx:alpine
    container_name: aw_nginx
    restart: unless-stopped
    volumes:
      - ./infra/docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - web
      - api
    networks:
      - aw_net
    profiles:
      - production

  ollama:
    image: ollama/ollama:latest
    container_name: aw_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:21434:11434"
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    mem_limit: 2g
    profiles: ["ai"]
    networks:
      - aw_net
    # Uncomment for GPU support (NVIDIA):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  kafka_data:
  zookeeper_data:
  prometheus_data:
  grafana_data:
  ollama_data:
  clamav_db:

networks:
  aw_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
